# The Roll's data. One record per entry; the site renders from this file.
# To add an entry: add a record here and drop its image in assets/arms/.
# Fields: id, name, category (government | military | institutions | people |
#         academic | ecclesiastical), blazon (the shield; a quoted source
#         blazon keeps the scope its source gives it), crest (only where the
#         arms bear one — kept separate from the blazon), motto (omit if
#         none), image, image_alt (omit to default to "Arms of <name>"),
#         image_credit, website (optional), notes. Entry names in English only
#         (keeper's ruling, 5 November 2026 — no Spanish name lines).

- id: texas
  category: "government"
  name: "State of Texas"
  motto: "Friendship"
  image: "assets/arms/texas-arms.png"
  image_alt: "Arms of the State of Texas"
  image_credit: "Emblazonment painted for this College, 2026, from the statutory blazon (Texas Government Code § 3101.002(a)): the shield Azure with the mullet Argent; the olive and live oak branches borne as supporters, tied with a ribbon Or; below, the motto Friendship on a scroll. The State's standard design as published bears the device alone, with no shield or ground; see the note."
  image2: "assets/arms/texas-arms-device.png"
  image2_alt: "The arms of the State of Texas in the State's standard design: the star and branches alone, with no shield or ground"
  image2_credit: "The State's own arms in an emblazonment painted for this College, 2026, after the standard design adopted by the Secretary of State in 1992: the white star encircled by live oak and olive branches, tied with a white ribbon, with no shield and no ground."
  blazon: "\"The state arms are a five-pointed white star, on an azure background, encircled by olive and live oak branches.\" (Texas Government Code § 3101.002(a), carrying forward the Act of the Congress of the Republic of Texas of 25 January 1839.) Azure, a mullet of five points Argent."
  notes: "The arms of the sovereign State, entered at the head of this Roll; no other sovereign arms are recorded here. The State's motto is Friendship (Texas Government Code § 3101.004; adopted 1930), the meaning of the name Tejas itself, from the Caddo táyshaʼ, 'friends' or 'allies.' The words REMEMBER THE ALAMO belong to the reverse of the state seal, not to the arms. The State's standard design shows the star and branches alone, with no shield and no ground; this Roll emblazons the statutory blazon in full — the star on its azure shield, the olive and live oak branches as supporters, and the motto on a scroll below. Older depictions differ: the Republic's $3 treasury note of 1841 shows the star alone on a round shield, and an 1876 lithograph sets the star and wreath as a medallion on a larger shield; both are recorded as variants, not followed."

- id: bexar-county
  category: "government"
  name: "Bexar County"
  blazon: "Quarterly: first, Argent, a bend Sable; an orle of eight chain links Or overall; second, Azure, Mission San Francisco de la Espada Argent; third, Vert, an eagle displayed Or; fourth, Gules, in chief a mullet and in base a cannon, both Argent. Above the shield, a Spanish ducal coronet; below, a banner inscribed BEXAR."
  image: "assets/arms/bexar-county.png"
  image_credit: "The county's official arms (adopted 1971), here in an emblazonment painted for this College, 2026, after the county's published depiction, with the Spanish ducal coronet above and the name on a banner below."
  notes: "The official coat of arms of Bexar County, adopted by the Commissioners Court on 22 December 1971 (the county website gives 1972). Designed by Thomas A. Wilson and illustrated by Ramon Vasquez y Sanchez; confirmed and approved by Fernando Muñoz Altea, King of Arms of the Royal House of Bourbon-Two Sicilies. The first quarter bears the arms of Don Álvaro de Zúñiga, Duke of Béjar, with the gold chains of Navarre; the cannon in the fourth quarter is turned toward the eagle of the third, for the wars Texas fought with Mexico and the United States."

- id: san-antonio
  category: "government"
  name: "City of San Antonio"
  blazon: "Per pale: dexter, Or and Gules over Argent semy of ermine spots Sable, overall a tau cross Azure; sinister, Gules, in chief a mullet Azure and Argent, in base the Alamo Argent. Above the shield, a mural crown Or; below, a banner inscribed LIBERTATIS CUNABULA. (Blazon rendered descriptively from the published depiction; the official blazon is to be confirmed.)"
  motto: "Libertatis Cunabula"
  image: "assets/arms/san-antonio.png"
  image_credit: "The city's arms as published by the City of San Antonio, here in an emblazonment painted for this College, 2026, with the mural crown above and the motto on a banner below."
  notes: "The arms of the City of San Antonio as published. The tau is the cross of Saint Anthony of Padua, the city's patron; the other half bears the Lone Star above the Alamo. The motto, Libertatis Cunabula — Cradle of Liberty — is the city's own, carried also on its seal (designed 1925 by Johannes C. Scholze; designated the official seal in 1981)."

- id: utsa
  category: "academic"
  name: "University of Texas at San Antonio"
  motto: "Disciplina Praesidium Civitatis"
  image: "assets/arms/utsa.png"
  image_alt: "Escutcheon of the University of Texas at San Antonio"
  image_credit: "The escutcheon from the centre of the crest of UT San Antonio (the crest itself is a trademark of the University), here set in a traditional shield in an emblazonment painted for this College, 2026, with the University's motto on a scroll beneath, added by this College. Shown for identification."
  blazon: "A shield Orange cut by three grooves embowed Argent, the base tier ending in an upward point. (Blazon rendered descriptively from the published depiction; no official blazon exists. The shield stands at the centre of the University's circular crest, ringed by the words THE UNIVERSITY OF TEXAS AT SAN ANTONIO.)"
  notes: "The crest of the city's public research university, founded 1969. The circular crest was adopted in 2025 for the unified UT San Antonio, formed on 1 September 2025 by the merger of the University of Texas at San Antonio with the University of Texas Health Science Center at San Antonio. The University's own account of the mark: its stacked tiers are the crested waves of the San Antonio River Basin, its base point an upward arrow of momentum and aspiration, and its shield an emblem of trust, academic rigor and protection. The motto, Disciplina Praesidium Civitatis — 'A cultivated mind is the guardian genius of democracy,' the words of Mirabeau B. Lamar — is the motto of the University of Texas System. The crest is a modern trademark device, not a grant of arms. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the University."

- id: archdiocese-of-san-antonio
  category: "ecclesiastical"
  name: "Archdiocese of San Antonio"
  blazon: "Azure, on a cross quadrate in the centre Argent a Tau-cross of the first; in dexter chief a star of the second. The shield is ensigned with a mitre. (Blazon as recorded in Heuser, Some Recent Episcopal Arms, The American Ecclesiastical Review, 1916.)"
  image: "assets/arms/archdiocese-of-san-antonio.png"
  image_credit: "The arms of the Archdiocese, here in an emblazonment painted for this College, 2026, after the published depiction (Wikimedia Commons, by Linestamp, CC0); the shield is ensigned with a mitre."
  notes: "The Roman Catholic archdiocese erected as the Diocese of San Antonio on 28 August 1874 and raised to an archdiocese on 3 August 1926; its cathedral is San Fernando, and its territory includes Bexar County. The tau is the crutch-cross of Saint Anthony of Padua, the city's patron; the star is the Lone Star of Texas. The same tau appears in the arms of the City of San Antonio in this Roll. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Archdiocese of San Antonio."

- id: lyndon-b-johnson
  category: "people"
  name: "Lyndon B. Johnson"
  image: "assets/arms/lbj.png"
  image_credit: "The arms as granted by the American College of Heraldry and Arms in 1968, here in an emblazonment painted for this College, 2026, with the armiger's motto on a scroll beneath as part of the painting."
  blazon: "Azure, on a saltire Gules fimbriated Argent between four eagles displayed, a mullet Or."
  crest: "On a wreath of the colors, an armed hand Argent supporting an eagle rising Or."
  motto: "Nobilitatis virtus non stemma character"
  notes: "The personal arms of Lyndon Baines Johnson (1908–1973), thirty-sixth President of the United States, granted to him at his own request on 1 June 1968 by the American College of Heraldry and Arms and presented to him in the Oval Office on 10 June 1968; the grant papers are held by the Lyndon B. Johnson Presidential Library. The granting college was a private American body (founded in Maryland in 1966, closed in 1970), not a sovereign heraldic authority, so the grant stands in a different class from President Kennedy's 1961 grant from the Chief Herald of Ireland or President Eisenhower's arms as a knight of the Danish Order of the Elephant. The motto is the old Johnson family motto: virtue, not lineage, is the mark of nobility. Johnson was a Hill Country man — born at Stonewall in Gillespie County, raised at Johnson City in Blanco County — and never lived in Bexar County or a neighbouring county; he is entered by the express exception of the keeper of this Roll. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Lyndon B. Johnson Presidential Library and Museum or the Johnson family."

- id: john-o-meusebach
  category: "people"
  name: "John O. Meusebach"
  image: "assets/arms/meusebach.png"
  image_credit: "The arms as engraved in Siebmacher's Wappenbuch of 1605 (public domain), here in an emblazonment painted for this College, 2026, with the armiger's motto on a scroll beneath as part of the painting; the shield is divided red over silver, with two wreaths in the chief and a Moor's head reversed in the base, and the crest a demi-Moor reversed from a crowned helm."
  blazon: "Per fess Gules and Argent; in chief two wreaths Vert side by side; in base a Moor's head reversed."
  crest: "On a crowned helm, a demi-Moor reversed; mantling Gules and Argent."
  motto: "Tenax Propositi"
  notes: "Born Otfried Hans Freiherr von Meusebach (1812–1897), a Prussian baron who on arrival in Texas put aside his title and adopted the name John O. Meusebach. He succeeded Prince Carl of Solms-Braunfels as commissioner-general of the Adelsverein, the German emigration society, and directed its colony from New Braunfels from 1845 to 1847; in 1847 he made the treaty with the Penateka Comanche that bears his name, and in 1846 he founded Fredericksburg. He sat in the Senate of Texas in 1851–53 for the district of Bexar, Comal and Medina, his home at New Braunfels in Comal County. His arms are his family's, recorded in Siebmacher's Wappenbuch of 1605 and in Zedlitz-Neukirch's Neues Preussisches Adels-Lexicon (1836); his motto, Tenax Propositi — steadfast in purpose — is remarked in the Handbook of Texas. Zedlitz-Neukirch's blazon calls both the Moor's head in the shield and the demi-Moor of the crest reversed, and this entry follows the blazon; Siebmacher's plate of 1605 draws both figures facing the other way. Entered under this Roll's rule for the neighbouring counties (Comal). Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the family of Meusebach."

- id: carl-of-solms-braunfels
  category: "people"
  name: "Prince Carl of Solms-Braunfels"
  image: "assets/arms/solms-braunfels.png"
  image_credit: "The arms of the house of Solms-Braunfels in full achievement — shield, helm, crest and mantling — in an emblazonment painted for this College, 2026, with the house's name on a scroll beneath, the house bearing no motto."
  blazon: "Or semy of billets Azure, a lion rampant Azure."
  crest: "A lion Azure sejant affronty between an open vol per fess Gules and Or; mantling Azure and Or."
  notes: "Carl, Prince of Solms-Braunfels (1812–1875), first commissioner-general of the Adelsverein, the German emigration society. He bought the tract on the Guadalupe and Comal rivers from Juan Martín Veramendi and Raphael C. Garza, and on Good Friday, 21 March 1845, founded New Braunfels at its head, naming it for Braunfels, his ancestral castle on the Lahn. His time in Texas was brief — some ten months in all — and he sailed for Germany on 15 May 1845 and never returned; the colony was carried on by John O. Meusebach, entered above. The arms are the house arms of Solms-Braunfels — the blue lion on gold strewn with blue billets — borne as the centre shield of the princely arms; they are not the differenced civic arms of the town of Braunfels. New Braunfels High School's unicorn mascot, adopted in 1928, descends from a misreading of these arms: the beast is a lion, not a unicorn. The Sophienburg cornerstone document of April 1845, which he authenticated 'by my signature and the impress of my family seal,' survives at the Sophienburg Museum in New Braunfels. Entered under this Roll's rule for the neighbouring counties (Comal). Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the House of Solms-Braunfels."
  image2: "assets/arms/adelsverein-seal.png"
  image2_alt: "Seal of the Adelsverein, 1845"
  image2_credit: "The society's own seal, as printed in 1845: a five-pointed star above a bundle of arrows, within an oval inscribed with its name. (DeGolyer Library, Southern Methodist University.)"

- id: ernst-von-coreth
  category: "people"
  name: "Ernst, Count von Coreth"
  image: "assets/arms/coreth.png"
  image_credit: "The arms of the Counts Coreth zu Coredo und Starkenberg (grants of 1766 and 1772), here in an emblazonment painted for this College, 2026, after the shield recorded in Siebmacher's Wappenbuch, vol. 4, Tirol (1857), plate 4, with the armiger's name on a scroll beneath as part of the painting."
  blazon: "Quarterly: first and fourth, Azure, three bars Or; second, per bend sinister, in chief Gules a lion Or lying along the bend facing the centre, below, divided by a line per bend from the bend to the base corner, Gules and Argent, two eight-pointed stars counterchanged; third, as the second reversed; overall an inescutcheon paly of four Gules and Argent. (After the counts' arms of 1766 as recorded in Siebmacher's Wappenbuch, vol. 4, Tirol (1857), p. 4 and plate 4; also in Tyroff's Wappen aller fürstlichen und gräflichen Häuser der österreichischen Monarchie (1853) and in Spreti's Enciclopedia Storico-Nobiliare Italiana, vol. II.)"
  notes: "Ernst Ignaz Franz, Graf von Coreth zu Coredo und Starkenberg (1803–1881), born at Vienna on 2 December 1803, a son of Graf Franz Joseph, who fell at Austerlitz in 1805; an Austrian army officer from 1820 to 1830. He came to Texas with his wife Agnes, née Erler, and their six children in the fall of 1846, on the ship York out of Antwerp, and farmed at New Braunfels in Comal County. In late 1847 he bought from John O. Meusebach, entered above, the 280-acre tract on Dry Comal Creek that Meusebach had chosen for himself — house, cabins, fences and ploughed land, for $3,266 — and lived on it the rest of his life; in 1852 his eldest daughter Agnes married Meusebach. His family is a Tyrolean house of the Val di Non seated at Castel Coredo. Ernst descends in the counts' line (raised to counts of the Empire in 1766 and to hereditary counts on 26 April 1772), and the arms entered here are the counts' arms; the small shield at the centre is the arms of the extinct Herren von Starkenberg, joined to the Coreth arms by the imperial augmentation of 1555. In the diploma form the shield stands on a black double-headed eagle beneath four helms and a count's crown; the depiction here follows this College's form — the shield under a single helm bearing the count's crown, with the family's stem crest, a wing in the colours of the stem shield. The sources differ in detail — on how the star quarters are divided, and on whether the heart-shield bears a small crown — and the depiction follows Siebmacher and Gritzner in both. Entered under this Roll's rule for the neighbouring counties (Comal). Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the family of Coreth."

- id: garcia-siller
  category: "people"
  name: "Gustavo García-Siller"
  image: "assets/arms/garcia-siller.png"
  image_credit: "The personal arms of Archbishop García-Siller, here in an emblazonment painted for this College, 2026, with the armiger's motto on a scroll beneath as part of the painting; the shield is shown with an archiepiscopal cross behind it and a green galero with ten tassels on either side above it. The arms follow the published depiction of the Archdiocese of San Antonio (depiction by SajoR, Wikimedia Commons, CC BY-SA 2.5)."
  blazon: "Per fess: in chief Vert, the Holy Spirit in the form of a dove descending Argent within a roundel Or charged with flames Gules; in base, upon a glory Or, the head and shoulders of Our Lady of Guadalupe, vested in her mantle spangled with stars Or. Behind the shield an archiepiscopal cross Or; above, a green galero with ten tassels on either side. (Blazon rendered descriptively from the published depiction.)"
  motto: "Ven Holy Spirit Ven"
  notes: "The personal arms of Gustavo García-Siller, a Missionary of the Holy Spirit, Archbishop of San Antonio since 2010. The dove and flames are the Holy Spirit of his congregation and his motto; Our Lady of Guadalupe is the patroness of Mexico, his native country, and of the Americas. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, Archbishop García-Siller or the Archdiocese of San Antonio."

- id: boulette
  category: "people"
  name: "Michael Joseph Boulette"
  image: "assets/arms/boulette.png"
  image_credit: "The personal arms of Bishop Boulette, here in an emblazonment painted for this College, 2026, with the armiger's motto on a scroll beneath as part of the painting; the shield is shown with a processional cross behind it and a green galero with six tassels on either side above it. The arms follow the published depiction (depiction by SajoR, Wikimedia Commons, CC BY-SA 2.5), whose scroll misletters the motto; it is lettered correctly here."
  blazon: "Per saltire Vert and Azure, a saltire Argent between: in chief an open book Or; in the dexter flank an ewer above a basin Or; in the sinister flank a pair of wings conjoined Or; in base a tau cross Or between the letters N and D Or. Behind the shield a processional cross Or; above, a green galero with six tassels on either side. (Blazon rendered descriptively from the published depiction.)"
  motto: "Wisdom Faith Discernment"
  notes: "The personal arms of Michael Joseph Boulette, auxiliary bishop of San Antonio since 2017. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, Bishop Boulette or the Archdiocese of San Antonio."

- id: cepeda
  category: "people"
  name: "José Arturo Cepeda Escobedo"
  image: "assets/arms/cepeda.png"
  image_credit: "The personal arms of Bishop Cepeda, here in an emblazonment painted for this College, 2026, with the armiger's motto on a scroll beneath as part of the painting; the shield is shown with a processional cross behind it and a green galero with six tassels on either side above it. The arms follow the published depiction (depiction by SajoR, Wikimedia Commons, CC BY-SA 2.5)."
  blazon: "Quarterly Sable and Azure: in the first quarter a tortoise Or; in the second a mullet Argent; in the third a ewer and basin with a towel Argent; in the fourth a closed book Or charged with a cross Sable. Behind the shield a processional cross Or; above, a green galero with six tassels on either side. (Blazon rendered descriptively from the published depiction.)"
  motto: "Audiendum, Fiendum, Nuntiandum"
  notes: "The personal arms of José Arturo Cepeda Escobedo, auxiliary bishop of San Antonio, formerly auxiliary bishop of Detroit, where these arms were first borne. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, Bishop Cepeda or the Archdiocese of San Antonio."

- id: janak
  category: "people"
  name: "Gary Wayne Janak"
  image: "assets/arms/janak.png"
  image_credit: "The personal arms of Bishop Janak, here in an emblazonment painted for this College, 2026, with the armiger's motto on a scroll beneath as part of the painting; the shield is shown with a processional cross behind it and a green galero with six tassels on either side above it. The arms follow the published depiction (depiction by SajoR, Wikimedia Commons, CC BY-SA 2.5)."
  blazon: "Azure: in dexter a crescent Argent, in sinister fretty Argent; on a chief Or, the Sacred Heart Gules, crowned with a cross and encircled by a crown of thorns, between a lily Argent above crossed logs and a rose Gules. Behind the shield a processional cross Or; above, a green galero with six tassels on either side. (Blazon rendered descriptively from the published depiction.)"
  motto: "Give Your Servant a Listening Heart"
  notes: "The personal arms of Gary Wayne Janak, auxiliary bishop of San Antonio since 2021. His motto is Solomon's prayer (1 Kings 3:9). Recorded here for identification; this entry implies no affiliation with, and no endorsement by, Bishop Janak or the Archdiocese of San Antonio."

- id: diocese-of-west-texas
  category: "ecclesiastical"
  name: "Episcopal Diocese of West Texas"
  image: "assets/arms/west-texas.png"
  image_credit: "The arms of the Diocese as depicted on Wikipedia: the quartered shield with the Alamo, the Lone Star, the winged lion of Saint Mark and the winged ox of Saint Luke, the six-flags escutcheon at the centre, a bishop's mitre above and the motto scroll below. A non-free depiction (© the Episcopal Diocese of West Texas), shown here for identification."
  blazon: "Quarterly Gules and Azure, a cross throughout Argent between: in the first quarter a representation of the Alamo Argent; in the second a mullet Argent; in the third the lion of Saint Mark Or; in the fourth the bull of Saint Luke Or; overall an escutcheon Azure bearing a trophy of six flags and a dovetailed banner Argent charged with a cross Gules. The shield is ensigned with a bishop's mitre, and below it a scroll bears the motto. (Blazon rendered from the diocese's own account of its shield and the description at Heraldry of the World.)"
  motto: "Πάντα δυνατὰ τῷ πιστεύοντι — Everything is possible to one who has faith (Mark 9:23)"
  notes: "The Episcopal diocese formed in 1874 as the Missionary District of Western Texas and erected a diocese in 1904; its see city is San Antonio and its territory includes Bexar County. Its shield was designed by the Reverend Louis A. Parker and adopted in 1927: the Alamo, cradle of Texas liberty; the star, for the Lone Star of Texas and the star of Bethlehem; the winged lion of Saint Mark; the winged ox of Saint Luke; and at the centre the six flags over Texas, the Church's banner the seventh. The depiction shown is the diocese's arms as published; the College's own standard rendering may replace it in time. Recorded for identification; this entry implies no affiliation with, and no endorsement by, the Diocese of West Texas."

- id: order-of-the-alamo
  category: "institutions"
  name: "Order of the Alamo"
  blazon: "Purpure, a mullet of five points Purpure fimbriated Or encircled by a wreath of live oak in dexter and olive in sinister Or, tied with a ribbon Or. Crest: on a wreath Purpure and Or, a crown Or. Supporters: on either side a griffin segreant Or, langued Gules."
  image: "assets/arms/order-of-the-alamo.png"
  image_alt: "Arms of the Order of the Alamo, as regularized by this College"
  image_credit: "Emblazonment painted for this College, 2026, of arms regularized by the College from the Order's own device in the colours of the Order's insignia: its star, an amethyst Purpure fimbriated Or, and its wreath Or set on a shield of the Order's purple, its two griffins Or retained as supporters, and its crown borne as a crest — the Order's crown, its points tipped with balls and its band jewelled, as it is painted in the Order's device, on a wreath upon a helm."
  image2: "assets/arms/order-of-the-alamo-device.png"
  image2_alt: "The Order of the Alamo's own device, emblazoned in the colours of the Order's insignia"
  image2_credit: "The Order's own device in an emblazonment painted for this College, 2026, its colours taken from the Order's insignia: the griffins, wreath, and crown Or; the star an amethyst Purpure; the name on a ribbon Purpure lettered Or."
  website: "https://theorderofthealamo.com/"
  notes: "Founded in 1909 (its incorporation is variously given as 1912 and 1915), the Order is, in its own words, a private club for men and women dedicated to the preservation of the Alamo and to the collection of materials relating to Texas history. Each April it stages the Coronation of the Queen of Fiesta at the Majestic Theatre; the Queen's court comprises a princess and twenty-four duchesses. The Order bears no arms of record and publishes no blazon; its device — two griffins upholding a wreath around the Lone Star, a crown above for the Queen the Order crowns, and its name on a scroll below — is heraldic in form though it bears no shield. The arms shown are this College's regularization of that device into armorial form, built from the device's own elements; they are not arms borne by the Order. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Order of the Alamo."

- id: holy-sepulchre
  category: "ecclesiastical"
  name: "Equestrian Order of the Holy Sepulchre of Jerusalem"
  image: "assets/arms/holy-sepulchre.png"
  image_alt: "Arms of the Equestrian Order of the Holy Sepulchre of Jerusalem, painted for this College"
  image_credit: "Emblazonment painted for this College, 2026: the arms of the Order in their full achievement — the red Jerusalem cross on its silver shield, a gold helmet with the Crown of Thorns above, two angels in red dalmatics as supporters, and the motto on its scroll below."
  blazon: "Argent, a cross potent between four crosslets Gules. (The arms attributed to the Latin Kingdom of Jerusalem, borne by the Order with the Jerusalem cross enamelled in red — the colour of blood, for the five wounds of Christ — as the Order's own accounts of its arms describe them.)"
  motto: "Deus lo vult"
  notes: "A Catholic order of knighthood under the protection of the Holy See, charged with supporting the Christian presence in the Holy Land. Its Southwestern Lieutenancy (Texas, Oklahoma, Arkansas and New Mexico) keeps an Archdiocese of San Antonio Section; San Antonio is typically the lieutenancy's second-largest city contingent after Houston, and the lieutenancy's annual investiture weekend was held in San Antonio on 5–7 September 2025, with the Investiture Mass at San Fernando Cathedral. In the full achievement, two white standards bearing the red cross flank the helmet, and the two angel supporters stand for the Order's crusading and pilgrim natures. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Equestrian Order of the Holy Sepulchre of Jerusalem."

- id: texas-cavaliers
  category: "institutions"
  name: "Texas Cavaliers"
  blazon: "Argent, a horseman with a lance Sable, cloaked and plumed Gules, within a bordure paly Argent and Gules. Crest: on a wreath Argent and Gules, a mullet Azure encircled by a wreath of live oak and olive branches proper."
  image: "assets/arms/texas-cavaliers.png"
  image_alt: "Arms of the Texas Cavaliers, as regularized by this College"
  image_credit: "Emblazonment painted for this College, 2026, of arms regularized by the College from the Cavaliers' organizational badge: the badge's mounted cavalier and red-and-white striped border set on a traditional shield, and its star borne as a crest on a wreath, within a wreath of live oak and olive after the crest of the State of Texas."
  image2: "assets/arms/texas-cavaliers-badge.png"
  image2_alt: "The Texas Cavaliers' own organizational badge, hand-painted"
  image2_credit: "The Cavaliers' own organizational badge in an emblazonment painted for this College, 2026: a mullet Azure; a shield-shaped badge bearing a horseman Sable, cloaked and plumed Gules, within a bordure paly Argent and Gules; and the name on a scroll Azure lettered Argent."
  notes: "A San Antonio civic organization founded in 1926, whose members choose King Antonio each year and whose River Parade raises money for children's charities in Bexar County through the Texas Cavaliers Charitable Foundation. The Cavaliers bear no arms of record and publish no blazon. The arms shown are this College's regularization of their organizational badge into armorial form, built from the badge's own devices; they are not arms borne by the Cavaliers. This entry implies no affiliation with, and no endorsement by, the Texas Cavaliers."

- id: adelsverein
  category: "institutions"
  name: "Adelsverein"
  blazon: "Or, a mullet of five points Azure above a sheaf of arrows Azure."
  image: "assets/arms/adelsverein.png"
  image_alt: "Seal of the Adelsverein, 1845, coloured for this College: a blue star above a sheaf of blue arrows on gold, within the society's inscribed oval"
  image_credit: "The society's 1845 seal, coloured for this College, 2026, in Or and Azure — the arms of Prince Carl of Solms-Braunfels, the society's first commissioner general in Texas."
  image2: "assets/arms/adelsverein-seal.png"
  image2_alt: "Seal of the Adelsverein, 1845"
  image2_credit: "The society's own seal, as printed in 1845: a five-pointed star above a bundle of arrows, within an oval inscribed with its name. (DeGolyer Library, Southern Methodist University.)"
  notes: "The Verein zum Schutze deutscher Einwanderer in Texas — the Society for the Protection of German Immigrants in Texas, known as the Mainzer Adelsverein — was organized on 20 April 1842 by twenty-one German noblemen at Biebrich on the Rhine and formally constituted on 25 March 1844, Prince Carl Emich III of Leiningen presiding. Its commissioners general in Texas were Prince Carl of Solms-Braunfels and, after him, John O. Meusebach, both entered in this Roll. Settling the Fisher–Miller grant, it landed more than 7,000 German emigrants in Texas and founded New Braunfels (1845) and Fredericksburg (1846); Meusebach's treaty with the Penateka Comanche (1847) opened the grant to settlement. The enterprise ended in debt in 1853. The society bore no arms of its own; its seal joins the star of Texas to a bundle of arrows — the old emblem of unity: a single arrow can be broken, a bound sheaf cannot. The College colours the device from the arms of Solms-Braunfels: of the society's founders, Prince Carl alone came to Texas, and the colours follow the man who was here."

- id: 141st-infantry
  category: "military"
  name: "141st Infantry Regiment"
  image: "assets/arms/141st-infantry.png"
  image_credit: "The regiment's coat of arms as drawn by the U.S. Army Institute of Heraldry (public domain)."
  blazon: "Per pale Argent and Gules, a fleur-de-lis Azure and the badge of the 3d Brigade, 1st Division, 4th Army Corps, during the Spanish-American War, Proper fimbriated of the first; on a chief dancetté of the third a mullet of the fifth. (Blazon of the U.S. Army Institute of Heraldry, quoted verbatim; the arms were approved 5 March 1931.)"
  crest: "That for the regiments and separate battalions of the Texas Army National Guard: on a wreath of the colors Argent and Gules, a mullet Argent encircled by a garland of live oak and olive Proper."
  motto: "Remember the Alamo"
  notes: "The 'First Texas' — the oldest regiment of the Texas Army National Guard, its lineage recognized by the U.S. Army Center of Military History from 18 February 1823, its senior company descending from the Washington Guards of 1836. It is a Bexar regiment: the Alamo Rifles of Béxar stand among the companies of its lineage from 1873, its headquarters has been at San Antonio since 1933, and its 1st Battalion is headquartered in San Antonio today. The shield's colours and star are those of the flag of the Texas Republic; the fleur-de-lis is for France in the First World War, and the corps badge for the Cuban occupation of 1898. Its colours carry the streamers Republic of Texas, The Alamo, and San Jacinto. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Regiment, the Texas Military Department, or the U.S. Army."

- id: amedd-regiment
  category: "military"
  name: "Army Medical Department Regiment"
  image: "assets/arms/amedd-regiment.png"
  image_alt: "Arms of the Army Medical Department Regiment"
  image_credit: "The arms of the Regiment in their official insignia rendering \u2014 shield, crest and motto as approved 31 October 2014 (U.S. Army artwork, public domain)."
  blazon: "Per pale; to dexter, paly of thirteen Gules and Argent, on a chief Azure, twenty mullets in four rows of five each of the second: to sinister, Argent, a staff entwined with a serpent Vert. (Blazon of the U.S. Army Institute of Heraldry, quoted verbatim; the current design was approved 31 October 2014, rescinding the design approved 17 April 1986.)"
  crest: "From a wreath Argent and Azure, upon a mound Argent (Silver Gray), a cock reguardant Proper. (On the regimental flag the arms are displayed on the breast of a displayed eagle, the crest above the eagle's head; the flag's background is maroon and its fringe white.)"
  motto: "Experientia et Progressus"
  notes: "The regiment of all Army medicine. Its arms rest on a device probably first used in 1818, the year Congress made the Medical Department permanent: the twenty stars are the twenty states of 1818, the stripes are the flag's, the green staff entwined with a serpent is the rod of Aesculapius (green was the Medical Corps colour of the nineteenth century), and the cock of the crest is Aesculapius's bird. Devised in their present line about 1863 under Surgeon General William Alexander Hammond, they are among the oldest regimental emblems in the Army. Fort Sam Houston is the Regiment's home (Headquarters, Department of the Army General Order 27 of 30 June 1986), and the Regiment Office stands at Joint Base San Antonio–Fort Sam Houston today. The motto is 'Experience and Progress.' The current arms date from 2014; the depiction shown is the official rendering, with the cock of the 2014 crest — not the laurel, cross and seven mullets of the crest it superseded, which older drawings still show. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Regiment or the United States Army."

- id: aetc
  category: "military"
  name: "Air Education and Training Command"
  image: "assets/arms/aetc.svg"
  image_credit: "The command's emblem as approved through Air Force heraldry (public domain)."
  blazon: "Azure, in front of a pair of stylized wings displayed Or a five-pointed star in flat perspective Argent pierced by a torch of the second flamant Gules, all within a diminished bordure of the second. Attached below the shield, a White scroll edged with a narrow Yellow border and inscribed 'AIR EDUCATION & TRAINING COMMAND' in Blue letters. (Emblem blazon as recorded by the U.S. Army Institute of Heraldry, quoted verbatim.)"
  crest: "An eagle, a cloud formation, and a heraldic wreath — so AETC Instruction 84-101 describes the crest of the command's coat of arms; the emblem in general use is the coat of arms without the crest."
  notes: "The Air Force's training command — 'The First Command' — established and activated in January 1942, the oldest major command in the Air Force, with headquarters at Randolph since 1957, today Joint Base San Antonio–Randolph. The device was approved as a shoulder patch on 4 October 1949 and as an emblem on 20 July 1953 for the Air Training Command, and was retained when the command was redesignated Air Education and Training Command on 1 July 1993. Every Airman begins in this command, and much of that training is in Bexar County. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the United States Air Force."

- id: sixteenth-air-force
  category: "military"
  name: "Sixteenth Air Force (Air Forces Cyber)"
  image: "assets/arms/sixteenth-air-force.png"
  image_alt: "Emblem of the Sixteenth Air Force"
  image_credit: "The air force's emblem, as approved through Air Force heraldry (public domain)."
  blazon: "Azure, a bend of the like semé of mullets and fimbriated Argent, overall the numeral “16” Or, all within a diminished bordure Yellow. Attached below the shield, a White scroll edged with a narrow Yellow border and inscribed with the designation “SIXTEENTH AIR FORCE” in Ultramarine Blue letters. (Emblem blazon as published in the Sixteenth Air Force's official history; the Air Force Historical Research Agency records the emblem as approved 4 April 1958, newest rendition 3 September 2003.)"
  notes: "The Air Force's information warfare headquarters, at Joint Base San Antonio–Lackland. The Sixteenth was the first numbered air force created after the Second World War, in 1954, and spent the Cold War in Spain; it was redesignated Sixteenth Air Force (Air Forces Cyber) on 30 September 2019 and activated at Lackland on 11 October 2019, the Twenty-Fourth and Twenty-Fifth Air Forces inactivated into it. From San Antonio it commands the Air Force's cyber, intelligence, surveillance, reconnaissance and electronic-warfare enterprise. In its shield the starred bend is adherence to the mission and its stars the quality of the rank and file; the great golden numerals are pride of performance. The scroll carries the designation only; the Air Force records no motto for the Sixteenth. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the United States Air Force."

- id: 37th-training-wing
  category: "military"
  name: "37th Training Wing"
  image: "assets/arms/37th-training-wing.svg"
  image_credit: "The wing's emblem as approved through Air Force heraldry (public domain)."
  blazon: "Azure, a saltire within a diminished border Or. Attached below the shield, a White scroll edged with a narrow Yellow border and inscribed '37 TRAINING WING' in Blue letters. (Emblem blazon of the Air Force Historical Research Agency, quoted verbatim.)"
  notes: "The host wing at Joint Base San Antonio–Lackland since 1 July 1993 and the largest training wing in the Air Force — the 'Gateway to the Air Force,' conducting all enlisted basic military training. The saltire is the crossroads: the honours of the 37th Pursuit Group, the Second World War 'Defenders of the Crossroads' of the Panama Canal, whose insignia the Air Force authorized the Wing to adopt in 1953. The emblem was approved for the Group on 23 June 1941 and for the Wing on 4 August 1953, reinstated 10 March 1992, and its newest rendition approved 28 March 2013. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the United States Air Force."

- id: 502d-air-base-wing
  category: "military"
  name: "502d Air Base Wing"
  image: "assets/arms/502d-air-base-wing.png"
  image_credit: "The wing's emblem as approved through Air Force heraldry (public domain)."
  blazon: "Per pale Azure and Vert a nebulee palewise Or, issuant at nombril a mullet couped Gules, surmounted by a second mullet Argent inner fimbriation of the first; all within a diminished bordure Or. Attached below the shield, a White scroll edged with a narrow Yellow border and inscribed '502D AIR BASE WING' in Blue letters. (Emblem blazon of the Air Force Historical Research Agency, quoted verbatim; the U.S. Army Institute of Heraldry carries the same wording for the wing's groups.)"
  notes: "The host wing for the whole of Joint Base San Antonio, activated at Fort Sam Houston on 1 August 2009 and headquartered there; it took host responsibility at Lackland and Randolph in 2010. The design's roots are in the wing's first official emblem, approved 8 July 1954: the divided shield is earth and sky, and the lone star — its three visible points the Air Force, the Army and the Navy in joint venture — pictures the joint-base mission. The recorded blazon divides the shield per pale, but the wing's official drawing divides it per fess nebuly, blue over green; the inconsistency stands in the official record itself, and both text and drawing are recorded here as they stand. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the United States Air Force."

- id: san-antonio-german-club
  category: "institutions"
  name: "San Antonio German Club"
  blazon: "Per bend sinister: dexter Gules, a crescent and a mullet Argent; sinister Argent, a lyre Gules. The shield is flanked by two palm trees, and below it a scroll is inscribed SAN ANTONIO GERMAN CLUB. (Blazon rendered descriptively from the club's depiction.)"
  image: "assets/arms/san-antonio-german-club.png"
    image_alt: "Arms of the San Antonio German Club, painted for this College: a silver crescent and star on red, a red lyre on white, flanked by two palm trees"
  image_credit: "Rendition painted for this College, 2026, of the club's arms: the shield, palm-tree supporters and name scroll as the club bears them."
    image2: "assets/arms/san-antonio-german-club-device.png"
      image2_alt: "Arms of the San Antonio German Club as used by the club"
        image2_credit: "The club's arms as used by the club, with its palm-tree supporters and name scroll."
  notes: "The arms of the German club of San Antonio, from the city's German-Texan community: the crescent and star on the red field, and a lyre in base for German song, the whole flanked by two palm trees — a Texas flourish on a German shield. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the club."

- id: canary-islands-descendants
  category: "institutions"
  name: "Canary Islands Descendants Association"
  image: "assets/arms/canary-islands-arms.svg"
  image_alt: "Arms of the Canary Islands, borne in the Association's seal"
  image_credit: "The arms of the Canary Islands, borne at the centre of the Association's seal — as depicted on Wikimedia Commons (public domain)."
  blazon: "Azure, seven islands Argent, well ordered, two, two, two and one in base; the shield ensigned with the royal crown of Spain, supported by two dogs proper, collared, and beneath a scroll Argent inscribed OCÉANO. (The arms of the Canary Islands, as set by the Statute of Autonomy of the Canary Islands, 1982 — borne entire at the centre of the Association's seal, whose legend reads CANARY ISLANDS DESCENDANTS ASSOCIATION, SAN ANTONIO, TEXAS, with the date MARCH 9, 1731 below.)"
  motto: "Océano"
  notes: "The association of the descendants of the Canary Island families who came to San Fernando de Béxar on 9 March 1731 and founded the Villa de San Fernando, the first regularly organized civil government in Texas; at its first election, 1 August 1731, Juan Leal Goraz was chosen alcalde. Before their departure, the Crown had granted the settler families the status of hidalgos. The association's seal adopts the arms of the founders' homeland entire and dates itself by the landing; this Roll shows the arms themselves, as borne at the seal's centre. The founders' church, San Fernando, is today the cathedral of the Archdiocese of San Antonio, entered above. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Association."

- id: isleno-founders
  category: "institutions"
  name: "The Isleño Founders of San Fernando de Béxar"
  notes: "The sixteen Canary Island families who founded the Villa de San Fernando in 1731, entered here as a body for the honor documented for them: by the Real Despacho of 14 February 1729 the Crown granted the settler families the status of hidalgos — hijosdalgo de solar conocido. No arms are documented for any founding family, and this Roll records none for them. The achievement printed for one family (Travieso, on the cover of The Travieso Family Papers, Los Bexareños, 2008) is a modern assumption, not a record; a Spanish surname blazon for Travieso stands in the armorials, but it belongs to peninsular lines and proves nothing for this one. The arms of the founders' homeland are borne in Bexar today in the seal of the Canary Islands Descendants Association, entered above. The sixteen, in the order of the Cuautitlán list of 8 November 1730, with home islands as the record gives them: Juan Leal Goraz (Lanzarote); Juan Curbelo (Lanzarote); Juan Leal, called el Mozo (Lanzarote); Antonio de los Santos (Lanzarote); Joseph Padrón (La Palma); Manuel de Niz (Gran Canaria); Vicente Álvarez Travieso (Tenerife); Salvador Rodríguez; Francisco de Arocha (La Palma); Antonio Rodríguez (Gran Canaria); Joseph Leal (Lanzarote); Juan Delgado, whose father Lucas Delgado had died on the journey; Joseph Cabrera, an orphan at the head of his young siblings (Lanzarote); María Rodríguez Robayna, a widow, with her Rodríguez Granado children; María Melián, widow of Lucas Delgado; and, counted together as the sixteenth family, four unmarried men — Phelipe Pérez and Joseph Antonio Pérez, brothers, and Ignacio and Martín Lorenzo de Armas, brothers. Fifty-six persons in all; they arrived at the Presidio on 9 March 1731, and on 1 August 1731 formed the first civil government in Texas."

- id: los-bexarenos
  category: "institutions"
  name: "Los Bexareños Genealogical and Historical Society"
  image: "assets/arms/los-bexarenos-arms.png"
  image_alt: "Arms of Los Bexareños"
  image_credit: "The Society's arms — the escutcheon, collar, and crown alone — from the Society's current emblem (© the Society), shown for identification. In the full emblem the escutcheon stands on a red shield-shaped field beneath a ribbon inscribed with the Society's name, upheld by two hands whose wrists run into tree roots, with the Society's motto below."
  blazon: "Per fess: in chief per pale, dexter quarterly Castile and León, sinister Argent the Mexican national emblem proper; in base Azure, a mullet Or between two laurel branches Argent; the escutcheon encircled by a collar of interlaced links Or, in the manner of the collar of the Golden Fleece, and ensigned with the royal crown of Spain. (Blazon rendered descriptively from the Society's emblem; no official blazon is published.)"
  motto: "Our History, Our Roots, Our Family / Nuestra Historia, Nuestras Raíces, Nuestra Familia"
  notes: "The genealogical and historical society of Hispanic Bexar, founded by Gloria V. Cadena in 1983 and chartered as a non-profit in 1987; its journal has appeared since 1983, now as the annual Yearly Register of translated censuses, marriages, baptisms, burials and wills. Among its publications is the Founding Canary Island Family papers series, including The Travieso Family Papers (2008), for the seventh founding family. The hands and roots that uphold the escutcheon in the full emblem are the Society's motto pictured: history held up by the families who descend from it. Recorded here for identification; this entry implies no affiliation with, and no endorsement by, the Society."

- id: jose-eligio-sanchez
  category: "people"
  name: "Jose Eligio Sanchez"
  image: "assets/arms/sanchez.png"
  image_credit: "The armiger's arms in their full achievement, as displayed on his page of the register of the Society of American Armigers (depiction by Ljubodrag Grujic), shown here for identification."
  blazon: "Per Pale to dexter Vert a castle triple towered Argent masoned Sable each Tower bearing a flagpole flying a pennant, the dexter Azure, the centre Argent a cross Gules and the sinister Argent a saltire Gules, on a Base wavy Azure three Barrulets wavy Argent; to sinister per fess in Chief Argent two Bends Or Fimbriated Gules overall a Lion ancient rampant Sable in Base Gules a Tower Or masoned Sable co-joint to dexter with a Scaling Ladder Or debruised by an Armored Knight Proper climbing up half way. (Blazon as recorded in the register of the Society of American Armigers.)"
  crest: "Issuant from a tower Argent masoned Sable a crossbow Proper."
  motto: "In Honorem Omnium Patrum Meorum"
  notes: "A living armiger of Schertz, Texas — a retired major of the United States Air Force. He was born in Puerto Rico, in a military hospital near the castle of San Felipe del Morro at San Juan, which the triple-towered castle of the dexter half commemorates. His arms were certified by Don Vicente de Cadenas y Vicent, Cronista Rey de Armas, in Spain on 27 May 2004 (Protocol 6/2004), and are recorded in The Armorial Register (No. 0571, 2020), with the American College of Heraldry (No. 4209, 2020), and with the Society of American Armigers (No. AA0180, 2025). Schertz stands on the Bexar–Guadalupe line, and he is entered under this Roll's rule for the neighbouring counties (Guadalupe). Recorded here for identification; this entry implies no affiliation with, and no endorsement by, Mr. Sanchez."

- id: mcatee
  category: "people"
  name: "Robert MᶜAtee"
  blazon: "Gules, on a fess Or a closet compony Argent and Sable, in chief four fusils in fess Or."
  crest: "On a torse Or and Gules, six arrows, three in bend and three in bend sinister, points upwards, fretted Or, entwined by a serpent erect in pale wavy Gules."
  motto: "Incepto Ne Desistam"
  image: "assets/arms/mcatee-painting.png"
  image_credit: "The armiger's own achievement, in the painted presentation rendering — the depiction the armiger himself chose for display. The vector master remains the rendering of record for the deed and the registries."
  notes: "The personal arms of the keeper of this Roll, assumed 7 August 2017 and borne by him and his lawful descendants. Entered here by the armiger himself."
